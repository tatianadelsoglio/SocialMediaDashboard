name: Deploy

# Corre cuando termina el workflow CI de un push a main, y solo si pasó.
# Va separado de CI para que la cancelación de corridas viejas de CI nunca
# corte un deploy a medias.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Un deploy por vez; si hay uno en curso, el siguiente espera (no se cancela)
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build para GitHub Pages
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # El mismo commit que pasó el CI
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy a GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
