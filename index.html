<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Social media dashboard with theme switcher</title>
    <meta
      name="description"
      content="Social media dashboard with a light and dark theme switcher: followers and daily stats per network. Frontend Mentor challenge built with React, TypeScript and Tailwind CSS."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- Colores de la franja superior (Top BG Pattern) de cada tema -->
    <meta name="theme-color" content="hsl(225, 100%, 98%)" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="hsl(232, 19%, 15%)" media="(prefers-color-scheme: dark)" />
    <!-- Aplica el tema antes del primer pintado (sin parpadeo).
         Misma clave y lógica que src/utils/themeUtils.ts. -->
    <script>
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        var color = dark ? 'hsl(232, 19%, 15%)' : 'hsl(225, 100%, 98%)'
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute('content', color)
        })
      })()
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding: 1.5rem; font-family: sans-serif; text-align: center">
        This dashboard needs JavaScript to run. Please enable it and reload the page.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
